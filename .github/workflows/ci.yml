# La fiecare push si pull request: testele si build-ul, inainte ca Vercel sa publice ceva stricat.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
